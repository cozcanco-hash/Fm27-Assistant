name: Import pinned upstream baseline

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-upstream
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'cozcanco-hash/Fm27-Assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import source once, preserving attribution
        shell: bash
        run: |
          set -euo pipefail
          if test -f pom.xml; then
            echo "Source already imported; nothing changed."
            exit 0
          fi
          cp README.md MACOS.md
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git -C "$source_dir" init --quiet
          git -C "$source_dir" remote add origin https://github.com/JelmerBouma1985/fm-ai-assistent.git
          git -C "$source_dir" fetch --depth=1 origin a06ac845acfd6c0eccbd61e3a633b3518584e457
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = a06ac845acfd6c0eccbd61e3a633b3518584e457
          git -C "$source_dir" archive FETCH_HEAD |
            tar --extract --exclude='.github/workflows' --exclude='src/main/bundles/dev.bundle' --exclude='src/main/bundles/prod.bundle'
          mv README.md README_UPSTREAM.md
          cp MACOS.md README.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AGENTS.md")
          text = p.read_text()
          old = ("- Commit messages in English. PR descriptions state that AI-agent-written code\n"
                 "  was produced by `Muse Spark 1.3 Contributor (opencode-go/muse-spark-1.3-contributor)`\n"
                 "  via OpenCode, reviewed and tested by the repository owner.")
          new = ("- Commit messages in English. Accurately identify code authorship and verification.\n"
                 "  Never claim a different model wrote the code or that the owner reviewed or tested it.")
          p.write_text(text.replace(old, new))
          PY
          git add --all
          git add --force docs/fm-tool-size-audit.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import upstream a06ac845 for private macOS adaptation"
          git push origin HEAD:main
