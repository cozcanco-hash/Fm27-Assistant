[workspace]
members = ["crates/fm27-core", "src-tauri"]
default-members = ["crates/fm27-core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
